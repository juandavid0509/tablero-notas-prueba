AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Infraestructura de AWS SAM para Tablero de Notas con Lambda, EC2, S3 y CloudFront.

Resources:
  # 1. Bucket S3 para alojar el Frontend compilado
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: tablero-notas-frontend-bucket

  # 2. Distribución CloudFront para entregar el Frontend React
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Origins:
          - DomainName: !GetAtt FrontendBucket.RegionalDomainName
            Id: S3Origin
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: allow-all
          AllowedMethods: [GET, HEAD]

  # 3. Función Lambda para el cálculo de Métricas
  MetricsLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: index.handler
      Runtime: nodejs18.x
      Events:
        GetMetrics:
          Type: Api
          Properties:
            Path: /metrics
            Method: get